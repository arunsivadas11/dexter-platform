spring:
  application:
    name: dexter-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

gcp:
  project-id: ${GCP_PROJECT_ID:}

firebase:
  credentials: ${FIREBASE_CREDENTIALS:}
  bucket-name: ${BUCKET_NAME:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
