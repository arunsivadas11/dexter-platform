name: About Me - CI

on:
  pull_request:
    paths:
      - 'aboutme/**'
      - '.github/workflows/aboutme-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'aboutme/**'
      - '.github/workflows/aboutme-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aboutme

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aboutme/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build