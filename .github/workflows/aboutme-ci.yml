name: About Me - CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'aboutme/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/aboutme-ci.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: aboutme

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aboutme/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build About Me
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/928545923418/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'github-aboutme-deployer@dexter-platform.iam.gserviceaccount.com'

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools
        working-directory: .

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting
        working-directory: .