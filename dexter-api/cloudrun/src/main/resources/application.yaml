spring:
  application:
    name: dexter-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    dev.dexterplatform.backend.security: DEBUG
    com.google.firebase: INFO
    org.springframework.security: INFO

dexter:
  gcp:
    project-id: ${GCP_PROJECT_ID:dexter-platform}
    preprocessing-bucket: ${PREPROCESSING_BUCKET:dexter-app-statements-preprocessing}
    postprocessing-bucket: ${POSTPROCESSING_BUCKET:dexter-app-statements-postprocessing}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:dexter-platform}
  security:
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  upload:
    max-file-size-bytes: 10485760
    allowed-extensions:
      - csv
